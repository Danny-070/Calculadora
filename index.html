<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de numeros primos y comparación</title>
    <link rel="stylesheet" href="Estilos/Styles.css">
</head>
<body>
    <!--Titulo de la pagina web-->
    <div>
        <header>
            <h1 id="title">Calculadora de numeros primos y comparación</h1>
        </header>
    </div>

    <!--Ingreso de datos en numeros-->

    <div>
        <label for="num1">Ingrese el primer número</label>
        <input type="number" id="num1">
    </div>
    <div>
        <label for="num2">Ingrese el seguno número</label>
        <input type="number" id="num2">
    </div>

    <!--Boton para activar el calculo-->

    <div>
        <button onclick="calcular()">Calcular y verficar</button>
    </div>

    <div id="resultado"></div>
    <script src="JavaScript/accion.js"></script>
</body>
</html>
